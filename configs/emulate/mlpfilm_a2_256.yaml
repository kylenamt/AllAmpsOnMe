# nam_a2_256 with a nonlinear FiLM generator -- the headline mlpfilm_wavenet
# run. Run name = file stem.
#
#   openamp emulate --config configs/emulate/mlpfilm_a2_256.yaml --overfit           # sanity #1
#   openamp emulate --config configs/emulate/mlpfilm_a2_256.yaml --limit-devices 10  # mini-run
#   openamp emulate --config configs/emulate/mlpfilm_a2_256.yaml                     # full run
#
# Identical to nam_a2_256.yaml except arch and the two cond_* knobs. Not
# parameter-matched (cond_hidden 32 roughly doubles the generator); see
# mlpfilm_a2_h16_256 for the matched control.
#
# Full copy of nam_a2.yaml's numbers -- see nam_a2.yaml for the derivation.

emulate:
  # --- Model -------------------------------------------------------------------
  arch: mlpfilm_wavenet    # A2 topology; per-layer MLP maps embedding -> (gamma, beta)
  wn_channels: 8           # A2 full-width submodel (the exports' other width is 3)
  embedding_dim: 256
  single_device: -1        # -1 = one-to-many over all render-ok devices
  cond_hidden: 32          # generator hidden width; ~2x film_wavenet's implicit 4,112/layer
  cond_activation: leakyrelu

  # --- Training (NAM's A2 numbers where the knob exists) -----------------------
  holdout_frac: 0.1
  clip_seconds: 2.0        # must match the corpus clip grid
  batch_size: 32
  pairs_per_epoch: 50000
  epochs: 140               # this run's total budget (started at 100, extended +40)
  lr: 6.25e-5                # ReduceLROnPlateau's annealed value partway through this
                              # run's training, not the initial 4.0e-3 -- see train_log.csv
  weight_decay: 3.17e-7
  plateau_patience: 3
  plateau_factor: 0.5
  early_stop_patience: 8
  stft_weight: 0.05         # NAM's MRSTFT weight, rescaled from MSE to this trainer's ESR term
  preemph: 0.85            # 0.0 = NAM-faithful (plain ESR, no pre-emphasis)
  num_workers: 6
  amp: true
  amp_dtype: bf16
  val_pairs: 2000
  log_every: 50
