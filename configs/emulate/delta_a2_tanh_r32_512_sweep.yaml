# delta_a2_tanh_r32_512 trained on the SWEEP-ONLY corpus -- TONE3000's own
# recipe, but one network conditioned on 405 amps at once instead of one
# network per amp. Run name = file stem.
#
#   OPENAMP_DATA_DIR=data_sweep openamp emulate --config configs/emulate/delta_a2_tanh_r32_512_sweep.yaml
#
# THE ENV VAR IS PART OF THE RECIPE. Without OPENAMP_DATA_DIR=data_sweep this
# trains on the EGDB corpus and silently re-runs the control under a
# different run name.
#
# data_sweep/ (scripts/build_sweep_corpus.py) uses NAM's own layout: train
# 10.0-181.0s, val/test both 181.0-190.0s (NAM defines no test split), native
# level (no -18 dBFS normalization, matching what enroll_pair feeds).
#
# lr/epochs here (4.0e-3, 150) are delta_a2_tanh_r32_512.yaml's *starting* lr
# and *total* budget, not that file's current hand-annealed values -- it was
# edited mid-flight for its own --resume and no longer describes a fresh run.
#
# Everything else is byte-identical to delta_a2_tanh_r32_512.yaml, so the
# corpus is the only variable.

emulate:
  # --- Model -------------------------------------------------------------------
  arch: delta_wavenet      # A2 topology; embedding -> low-rank residual on each conv
  wn_channels: 8           # A2 full-width submodel (the exports' other width is 3)
  wn_activation: tanh      # "leakyrelu" (the capture default) | "tanh"
  embedding_dim: 512       # widened with the rank so 23*32=736 DOF is not clipped to 256
  single_device: -1        # -1 = one-to-many over all render-ok devices
  delta_rank: 32           # generator is the limit only above rank 22 at this E

  # --- Training (NAM's A2 numbers where the knob exists) -----------------------
  holdout_frac: 0.1
  clip_seconds: 2.0        # must match the corpus clip grid
  batch_size: 32
  pairs_per_epoch: 50000   # held at the control's value; ~1.44 passes/epoch over this
                           # corpus's 19.2h of unique audio, vs 0.13 on EGDB
  epochs: 150
  lr: 4.0e-3                # keep the decimal point -- PyYAML reads bare 4e-3 as a string
  weight_decay: 3.17e-7
  plateau_patience: 3
  plateau_factor: 0.5
  early_stop_patience: 15
  stft_weight: 0.05         # held at the EGDB-derived value deliberately, to keep the
                            # corpus as the only variable (this corpus's own NAM-scaled
                            # weight would be ~0.104; the STFT term is known to
                            # misbehave on this signal -- see pair enrollment notes)
  preemph: 0.85
  num_workers: 6
  amp: true
  amp_dtype: bf16
  val_pairs: 2000
  log_every: 50
