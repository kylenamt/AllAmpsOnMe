
# nam_a2_tanh_ch16_256 at embedding_dim 512, trained on the EGDB+SWEEP corpus with the
# Lel 3000 capture dropped. Run name is the file stem ("nam_a2_tanh_ch16_512") ->
# results/emulate/nam_a2_tanh_ch16_512/.
#
#   OPENAMP_DATA_DIR=data_mixed openamp emulate --config configs/emulate/nam_a2_tanh_ch16_512.yaml
#
# THE ENV VAR IS PART OF THE RECIPE. Without OPENAMP_DATA_DIR=data_mixed this trains on the
# sweep-free EGDB corpus over 405 devices and silently reproduces a different experiment
# under this name.
#
# THREE THINGS CHANGE AT ONCE relative to nam_a2_tanh_ch16_256 (best_val_esr 0.05027, 340,033
# params, 21.36 h / 100 epochs). Attribution across them is not possible from this run alone:
#
#   1. embedding_dim 256 -> 512. The only knob edited below. On the ch8 arm this direction
#      HURT — nam_a2_256 0.0876 -> nam_a2_512 0.0923 for +198k params — so this is the arm
#      most likely to come back null or negative. It is worth running at ch16 because the
#      wider trunk is the only one that has shown headroom (tanh at ch8 0.0796 -> ch16 0.0503).
#
#   2. The corpus is data_mixed/ (scripts/build_mixed_corpus.py): the 88 EGDB files plus the
#      TONE3000 v3 capture signal, sliced into NAM's own regions —
#        train  sweep_train  10.0-181.0 s (171 s), on top of the 70 EGDB train files
#        val    sweep_val    181.0-190.0 s (9 s)
#        test   sweep_test   the same 9 s block (NAM defines no test split)
#      Every emulate run before this one trained SWEEP-FREE: NAM_SWEEP_FILENAME is
#      "v3_0_0.wav" but the file on disk is "T3K-sweep-v3.wav", so corpus/build.py set
#      have_sweep = False without warning. The measured sweep domain gap is 16-70x on sweep
#      content, which is what this run is meant to close.
#
#      Two properties of that corpus to keep in mind when reading the numbers:
#      - EmulationDataset draws FILES uniformly, not duration-weighted, so sweep_train gets
#        1/71 = 1.4% of training windows despite being 8.2% of the train audio. Over 100
#        epochs x 50k pairs that is still ~70k sweep windows. Left uniform deliberately so
#        the sampler is not a fourth changed variable.
#      - sweep_val is the 181-190 s block, which is a byte-for-byte copy of the 0-9 s lead-in
#        — guitar DI. The blips, chirps and noise bursts live only at 10-17 s, inside
#        sweep_train. So val ESR is held out, but it does NOT measure chirp fidelity.
#
#   3. 404 devices, not 405: device 486 ("Lel 3000 1993 — output_amp2") is appended to
#      data_mixed/manifests/emulate_holdout.txt. Its renders sit ~20 dB below the corpus and
#      its test ESR exceeds 1.0 in every run that has per-device output — the model does worse
#      on it than predicting silence. Dropping it lowers val and test ESR on its own, so the
#      headline number here is NOT comparable to the 405-device runs without restricting both
#      sides to the shared devices. It is in the holdout file, so it is also a default
#      enrollment target: pass `emulate-enroll --devices` explicitly to keep it out of Phase 5.
#
# Capture provenance: data_mixed renders come from the A1 (WaveNet) captures, matching
# data/ — data_sweep/ could not be reused because `openamp migrate-a2` re-pointed the
# manifest at A2 models between the two render jobs. See scripts/stage_sweep_a1.py.
#
# This is a FULL copy of nam_a2_tanh_ch16_256.yaml with one number changed, not a delta: a
# per-run file is read *instead of* configs/openamp.yaml, not merged over another emulate
# config, so anything omitted here falls back to the EmulateConfig dataclass defaults
# (stft_weight 1.0, weight_decay 0.0, lr 5e-4 — the paper's TCN numbers), silently undoing
# the NAM recipe. See nam_a2.yaml for the full derivation of every value below.
#
# Budget ~21-23 h: 100 epochs at ch16 cost 21.36 h at embedding_dim 256, and the wider FiLM
# generator adds Linear(512, 2C) per layer to a step that is launch-bound, not FLOP-bound.

emulate:
  # --- Model -------------------------------------------------------------------
  arch: film_wavenet
  # 2x the A2 full-width submodel, i.e. off NAM's schema — conv weights go as channels^2,
  # so this is the width arm of the sweep, not a NAM-faithful point.
  wn_channels: 16
  embedding_dim: 512       # the only knob changed from nam_a2_tanh_ch16_256.yaml (256)
  single_device: -1        # -1 = one-to-many over all render-ok devices
  wn_activation: tanh      # "leakyrelu" (the capture default) | "tanh"


  # --- Training (NAM's A2 numbers where the knob exists) -----------------------
  holdout_frac: 0.1
  clip_seconds: 2.0        # must match the corpus clip grid
  # NAM uses 16; 32 here on purpose. This model is launch-bound, not compute-bound
  # (23 layers of small convs = a few hundred tiny kernels/step, GPU sat at 68% SM and
  # 127 W of 250 W at batch 16), so halving the step count per epoch buys wall clock the
  # GPU was idling through anyway. lr is left at NAM's 4e-3: linear scaling would say
  # 8e-3, but 1e-2 diverged on this topology inside 100 steps.
  batch_size: 32
  pairs_per_epoch: 50000
  epochs: 100              # NAM trainer.max_epochs; early-stop still ends it sooner
  # NAM optimizer block, verbatim. Keep the decimal point: PyYAML resolves bare
  # `4e-3` as a *string*, which reaches Adam untyped and dies at construction.
  lr: 4.0e-3
  weight_decay: 3.17e-7
  plateau_patience: 3
  plateau_factor: 0.5
  early_stop_patience: 8
  # NAM's 5e-4 MRSTFT weight rescaled from its MSE term to this trainer's ESR term
  # (ESR = MSE / mean(t^2); corpus renders sit at median mean(t^2) 0.0096). Held at the
  # EGDB-derived value even though data_mixed now contains sweep audio, so the corpus is
  # not entangled with a loss-weight change; the sweep is 1.4% of draws.
  stft_weight: 0.05
  preemph: 0.85            # 0.0 = NAM-faithful (plain ESR, no pre-emphasis)
  num_workers: 6
  amp: true
  amp_dtype: bf16
  val_pairs: 2000
  log_every: 50
