# The original sketch: every device owns a free, unconstrained weight
# residual -- the full-rank limit of delta_wavenet, and the ceiling on what
# per-device weight conditioning can buy at that hook (compare against the
# delta_a2_* ladder). Run name = file stem.
#
#   openamp emulate --config configs/emulate/table_a2_256.yaml --overfit           # sanity #1
#   openamp emulate --config configs/emulate/table_a2_256.yaml --limit-devices 10  # mini-run
#   openamp emulate --config configs/emulate/table_a2_256.yaml                     # full run
#
# Three things unlike every other config here:
#   1. embedding_dim is DERIVED, not configured (64*156 kernel + 23*8 bias +
#      23*8 mixin = 10,352/device); the key is ignored if set, so it's kept
#      out of this file entirely.
#   2. Parameters scale with device count (10,352 * 405 = 4,192,560, ~17x
#      delta_a2_256's total). --limit-devices shrinks the model, so mini-run
#      numbers are NOT comparable with the full run.
#   3. CANNOT be enrolled: held-out devices have no row and no shared
#      structure to be positioned within, so emulate-enroll refuses this
#      arch. Val ESR here is a capacity ceiling over *trained* devices, not generalization.
#
# Still folds/exports (a device's row IS its delta) and supports inference-time
# part masking (model.set_delta_parts(kernel=..., bias=..., mixin=...)).
#
# WATCH: this arch has no magnitude constraint (no scale, no normalized
# basis) -- unlike delta_wavenet, nothing stops the table drifting away from
# a residual. If it does, that's a finding about why the low-rank
# parameterization exists, not a bug. Table starts at zero, so every device
# begins as the plain A2 net.
#
# Full copy of nam_a2.yaml's numbers -- see nam_a2.yaml for the derivation.

emulate:
  # --- Model -------------------------------------------------------------------
  arch: tabledelta_wavenet # A2 topology; free per-device weight residual, no generator
  wn_channels: 8           # A2 full-width submodel (the exports' other width is 3)
  single_device: -1        # -1 = one-to-many over all render-ok devices
  # no embedding_dim / delta_rank here -- both are meaningless for this arch

  # --- Training (NAM's A2 numbers where the knob exists) -----------------------
  holdout_frac: 0.1        # drawn as usual, but these devices can never be enrolled
  clip_seconds: 2.0        # must match the corpus clip grid
  batch_size: 32
  pairs_per_epoch: 50000
  epochs: 100              # NAM trainer.max_epochs; early-stop still ends it sooner
  lr: 4.0e-3                # keep the decimal point -- PyYAML reads bare 4e-3 as a string
  weight_decay: 3.17e-7
  plateau_patience: 3
  plateau_factor: 0.5
  early_stop_patience: 15
  stft_weight: 0.05         # NAM's MRSTFT weight, rescaled from MSE to this trainer's ESR term
  preemph: 0.85            # 0.0 = NAM-faithful (plain ESR, no pre-emphasis)
  num_workers: 6
  amp: true
  amp_dtype: bf16
  val_pairs: 2000
  log_every: 50
