# mlpfilm_a2_256 (cond_hidden 32) with cond_activation switched to tanh.
# Run name is the file stem ("mlpfilm_a2_h32_tanh_256") -> results/emulate/mlpfilm_a2_h32_tanh_256/.
#
#   openamp emulate --config configs/emulate/mlpfilm_a2_h32_tanh_256.yaml --overfit           # sanity #1
#   openamp emulate --config configs/emulate/mlpfilm_a2_h32_tanh_256.yaml --limit-devices 10  # mini-run
#   openamp emulate --config configs/emulate/mlpfilm_a2_h32_tanh_256.yaml                     # full run
#
# Why this run exists: mlpfilm_a2_256 (cond_hidden 32, cond_activation leakyrelu)
# landed within noise of nam_a2_256's linear FiLM (best_val_esr 0.0872 vs 0.0876,
# both fully plateaued). But wn_activation=tanh on the WaveNet *body* (not the
# FiLM generator) was worth far more: nam_a2_tanh_256 hit 0.0796 and
# nam_a2_tanh_ch16_256 hit 0.0503. This run asks the same question of the
# conditioning path: does tanh in the FiLM generator do anything, at the same
# cond_hidden=32 capacity already tested with leakyrelu.
#
# Known confound, carried over from mlpfilm_a2_256.yaml's note: tanh sits in its
# linear region at init (measured 0.35% nonlinear), so early epochs are close to
# a re-parameterized linear FiLM before the weights grow into the nonlinear
# range. A null result here is weaker evidence than the leakyrelu run; a
# positive result is still meaningful.
#
# FULL copy of nam_a2.yaml semantics, not a delta — see mlpfilm_a2_256.yaml.

emulate:
  # --- Model -------------------------------------------------------------------
  arch: mlpfilm_wavenet    # A2 topology; per-layer MLP maps embedding -> (gamma, beta)
  wn_channels: 8           # A2 full-width submodel (the exports' other width is 3)
  embedding_dim: 256
  single_device: -1        # -1 = one-to-many over all render-ok devices
  cond_hidden: 32          # same capacity as mlpfilm_a2_256 — only cond_activation changes
  cond_activation: tanh

  # --- Training (NAM's A2 numbers where the knob exists) -----------------------
  holdout_frac: 0.1
  clip_seconds: 2.0        # must match the corpus clip grid
  batch_size: 32
  pairs_per_epoch: 50000
  epochs: 100              # NAM trainer.max_epochs; early-stop still ends it sooner
  # NAM optimizer block, verbatim. Keep the decimal point: PyYAML resolves bare
  # `4e-3` as a *string*, which reaches Adam untyped and dies at construction.
  lr: 4.0e-3
  weight_decay: 3.17e-7
  plateau_patience: 3
  plateau_factor: 0.5
  early_stop_patience: 8
  # NAM's 5e-4 MRSTFT weight rescaled from its MSE term to this trainer's ESR term
  # (ESR = MSE / mean(t^2); corpus renders sit at median mean(t^2) 0.0096).
  stft_weight: 0.05
  preemph: 0.85            # 0.0 = NAM-faithful (plain ESR, no pre-emphasis)
  num_workers: 6
  amp: true
  amp_dtype: bf16
  val_pairs: 2000
  log_every: 50
