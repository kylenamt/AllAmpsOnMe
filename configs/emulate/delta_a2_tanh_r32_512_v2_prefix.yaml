# delta_a2_tanh_r32_512_v2 with train-time nested dropout on the embedding
# (embed_prefix_sizes). Run name = file stem.
#
#   openamp emulate --config configs/emulate/delta_a2_tanh_r32_512_v2_prefix.yaml --limit-devices 10  # mini-run
#   openamp emulate --config configs/emulate/delta_a2_tanh_r32_512_v2_prefix.yaml                     # full run
#
# ONE KNOB differs from delta_a2_tanh_r32_512_v2.yaml: embed_prefix_sizes
# () -> [8 .. 512]. That run is the control -- same corpus, same everything
# else -- so the pair isolates the ordering.
#
# Nested dropout: at each train step every row keeps only its first k dims
# (the rest zeroed), k drawn uniformly from embed_prefix_sizes, or all 512 with
# probability embed_prefix_full_frac. The goal is an *ordered* embedding: the
# leading dims carry the coarse amp and each later dim refines it, so a
# truncated vector degrades gracefully (less is fine, more is better) instead
# of falling apart. The cut comes after embed_normalize's projection. Train
# steps only -- val/eval read all 512 dims.
#
# The last dim is trained on 0.5 + 0.5/7 = 57% of samples.
#
# Full copy of delta_a2_tanh_r32_512_v2.yaml's numbers otherwise.

model:
  arch: delta_wavenet  # A2 topology; embedding -> low-rank residual on each conv
  channels: 8  # A2 full-width submodel (the exports' other width is 3)
  activation: tanh  # "leakyrelu" (the capture default) | "tanh"
  embedding_dim: 512  # widened with the rank so 23*32=736 DOF is not clipped to 256
  delta_rank: 32  # generator is the limit only above rank 22 at this E
  embed_normalize: true  # e = embed_scale * normalize(row)


data:
  dataset: emulation

  holdout_frac: 0.1
  clip_seconds: 2.0  # must match the corpus clip grid
  pairs_per_epoch: 50000

loss:
  name: esr_mrstft
  stft_weight: 0.05  # NAM's MRSTFT weight, rescaled from MSE to this trainer's ESR term
  preemph_coeff: 0.85  # 0.0 = NAM-faithful (plain ESR, no pre-emphasis)
  device_loss_weighting: 1.0  # per-device ESR weighting (train loss + val ESR)


training:
  batch_size: 32
  epochs: 150
  lr: 4.0e-3
  weight_decay: 0.01
  plateau_patience: 3
  plateau_factor: 0.7
  early_stop_patience: 999
  embed_prefix_sizes: [8, 16, 32, 64, 128, 256, 512]  # the one knob changed from v2 (off)
  embed_prefix_full_frac: 0.5
  num_workers: 6
  amp: true
  amp_dtype: bf16
  val_pairs: 2000
  log_every: 50
