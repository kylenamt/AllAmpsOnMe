# nam_a2_tanh_256 at wn_channels 16 -- the width sweep point off
# nam_a2_tanh_256.yaml (conv weights scale as channels^2, so this is off
# NAM's own schema). Run name = file stem.
#
#   openamp emulate --config configs/emulate/nam_a2_tanh_ch16_256.yaml --overfit           # sanity #1
#   openamp emulate --config configs/emulate/nam_a2_tanh_ch16_256.yaml --limit-devices 10  # mini-run
#   openamp emulate --config configs/emulate/nam_a2_tanh_ch16_256.yaml                     # full run
#
# Full copy of nam_a2_tanh_256.yaml's numbers -- see nam_a2.yaml for the derivation.

emulate:
  # --- Model -------------------------------------------------------------------
  arch: film_wavenet
  wn_channels: 16          # the only change from nam_a2_tanh_256.yaml (8); off NAM's schema
  embedding_dim: 256
  single_device: -1        # -1 = one-to-many over all render-ok devices
  wn_activation: tanh      # "leakyrelu" (the capture default) | "tanh"

  # --- Training (NAM's A2 numbers where the knob exists) -----------------------
  holdout_frac: 0.1
  clip_seconds: 2.0        # must match the corpus clip grid
  batch_size: 32           # NAM uses 16; doubled since this model is launch-bound, not compute-bound
  pairs_per_epoch: 50000
  epochs: 100              # NAM trainer.max_epochs; early-stop still ends it sooner
  lr: 4.0e-3                # keep the decimal point -- PyYAML reads bare 4e-3 as a string
  weight_decay: 3.17e-7
  plateau_patience: 3
  plateau_factor: 0.5
  early_stop_patience: 8
  stft_weight: 0.05         # NAM's MRSTFT weight, rescaled from MSE to this trainer's ESR term
  preemph: 0.85            # 0.0 = NAM-faithful (plain ESR, no pre-emphasis)
  num_workers: 6
  amp: true
  amp_dtype: bf16
  val_pairs: 2000
  log_every: 50
