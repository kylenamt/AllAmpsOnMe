# delta_a2_256 at rank 16 — the capacity end of the delta_wavenet sweep.
# Run name is the file stem ("delta_a2_r16_256") -> results/emulate/delta_a2_r16_256/.
#
#   openamp emulate --config configs/emulate/delta_a2_r16_256.yaml --overfit           # sanity #1
#   openamp emulate --config configs/emulate/delta_a2_r16_256.yaml --limit-devices 10  # mini-run
#   openamp emulate --config configs/emulate/delta_a2_r16_256.yaml                     # full run
#
# Identical to delta_a2_256.yaml except delta_rank. Why 16 specifically: each layer's
# coeff compresses the 256-dim embedding to `delta_rank` numbers before it touches
# anything, so the *whole* conditioning path is a bottleneck of 23 * delta_rank
# effective degrees of freedom. At rank 8 that is 184 — fewer than film_wavenet's
# ~256 (23 layers * 2C = 368 outputs, capped by the 256-dim embedding). So if
# delta_a2_256 ties or loses against nam_a2_256, "the weight hook is no better than
# FiLM" and "rank 8 steers through fewer knobs than FiLM does" are both live
# explanations and the pair cannot separate them.
#
# Rank 16 removes that confound from the other side: 23 * 16 = 368 > 256, so the
# embedding is the bottleneck again, exactly as it is for film_wavenet. Read the
# three delta runs as a capacity ladder against nam_a2_256's 94,576 generator params:
#
#   r6  ->  97,601 params, 138 DOF   parameter-matched, generator-bottlenecked
#   r8  -> 130,127 params, 184 DOF   the default
#   r16 -> 260,231 params, 368 DOF   embedding-bottlenecked, like FiLM
#
# If r16 is where the delta hook finally pays, the mechanism needed the width; if all
# three sit together, the hook itself is the answer and the DOF story is dead.
#
# Not parameter-matched by design (2.75x film_wavenet's generator). The generator is
# folded away per morph point, so this costs training params and bundle bytes
# (~0.57 -> ~2.2 MB), never real-time CPU — the folded network is a stock A2 capture
# at every rank.
#
# FULL copy of nam_a2.yaml semantics, not a delta — see delta_a2_256.yaml.

emulate:
  # --- Model -------------------------------------------------------------------
  arch: delta_wavenet      # A2 topology; embedding -> low-rank residual on each conv
  wn_channels: 8           # A2 full-width submodel (the exports' other width is 3)
  embedding_dim: 256
  single_device: -1        # -1 = one-to-many over all render-ok devices
  delta_rank: 16           # 23 * 16 = 368 DOF > embedding_dim, so E is the limit

  # --- Training (NAM's A2 numbers where the knob exists) -----------------------
  holdout_frac: 0.1
  clip_seconds: 2.0        # must match the corpus clip grid
  batch_size: 32
  pairs_per_epoch: 50000
  epochs: 100              # NAM trainer.max_epochs; early-stop still ends it sooner
  # NAM optimizer block, verbatim. Keep the decimal point: PyYAML resolves bare
  # `4e-3` as a *string*, which reaches Adam untyped and dies at construction.
  lr: 4.0e-3
  weight_decay: 3.17e-7
  plateau_patience: 3
  plateau_factor: 0.5
  early_stop_patience: 15   # 8 burned attempt 1 while it was still recovering from a loss spike
  # NAM's 5e-4 MRSTFT weight rescaled from its MSE term to this trainer's ESR term
  # (ESR = MSE / mean(t^2); corpus renders sit at median mean(t^2) 0.0096).
  stft_weight: 0.05
  preemph: 0.85            # 0.0 = NAM-faithful (plain ESR, no pre-emphasis)
  num_workers: 6
  amp: true
  amp_dtype: bf16
  val_pairs: 2000
  log_every: 50
