# mlpfilm_a2_256 at cond_hidden 16 -- the parameter-matched control (4,384
# params/layer vs film_wavenet's 4,112). Run name = file stem.
#
#   openamp emulate --config configs/emulate/mlpfilm_a2_h16_256.yaml --overfit           # sanity #1
#   openamp emulate --config configs/emulate/mlpfilm_a2_h16_256.yaml --limit-devices 10  # mini-run
#   openamp emulate --config configs/emulate/mlpfilm_a2_h16_256.yaml                     # full run
#
# Caveat: with leakyrelu, ~half of a 16-unit hidden layer sits on the 0.01
# slope, so effective width is ~8. A null result here is evidence against
# nonlinearity at this width, not in general.
#
# Full copy of nam_a2.yaml's numbers -- see mlpfilm_a2_256.yaml.

model:
  arch: mlpfilm_wavenet  # A2 topology; per-layer MLP maps embedding -> (gamma, beta)
  channels: 8  # A2 full-width submodel (the exports' other width is 3)
  embedding_dim: 256
  cond_hidden: 16  # 4,384 params/layer vs film_wavenet's 4,112 — matched
  cond_activation: leakyrelu

data:
  dataset: emulation

  holdout_frac: 0.1
  clip_seconds: 2.0  # must match the corpus clip grid
  pairs_per_epoch: 50000

loss:
  name: esr_mrstft
  stft_weight: 0.05  # NAM's MRSTFT weight, rescaled from MSE to this trainer's ESR term
  preemph_coeff: 0.85  # 0.0 = NAM-faithful (plain ESR, no pre-emphasis)

training:
  batch_size: 32
  epochs: 100  # NAM trainer.max_epochs; early-stop still ends it sooner
  lr: 4.0e-3  # keep the decimal point -- PyYAML reads bare 4e-3 as a string
  weight_decay: 3.17e-7
  plateau_patience: 3
  plateau_factor: 0.5
  early_stop_patience: 8
  num_workers: 6
  amp: true
  amp_dtype: bf16
  val_pairs: 2000
  log_every: 50
