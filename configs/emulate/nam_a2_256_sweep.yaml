# nam_a2_256 trained on the SWEEP-ONLY corpus -- TONE3000's own recipe, but
# one network conditioned on 405 amps at once instead of one network per amp.
# Run name = file stem.
#
#   python scripts/build_sweep_corpus.py                                  # once
#   OPENAMP_DATA_DIR=data_sweep openamp render --devices @data_sweep/manifests/render_subset.txt
#   OPENAMP_DATA_DIR=data_sweep openamp emulate --config configs/emulate/nam_a2_256_sweep.yaml
#
# THE ENV VAR IS PART OF THE RECIPE. Without OPENAMP_DATA_DIR=data_sweep this
# trains on the EGDB corpus and silently reproduces nam_a2_256 under a
# different run name.
#
# Every knob below is byte-identical to nam_a2_256.yaml on purpose -- the
# corpus is the only variable, so do not tune anything here without changing
# nam_a2_256.yaml too. What differs is upstream, in data_sweep/: the TONE3000
# v3 capture signal in NAM's own regions (train 10.0-181.0s, val/test both
# 181.0-190.0s -- NAM defines no test split, so val is not truly held out),
# native level (no -1 dBFS peak cap, matching what enroll_pair feeds), and
# 171s/device of unique audio vs 1913s/device on EGDB (pairs_per_epoch left
# at 50000 anyway, so the optimization budget matches).

emulate:
  # --- Model -------------------------------------------------------------------
  arch: film_wavenet
  wn_channels: 8           # A2 full-width submodel (the exports' other width is 3)
  embedding_dim: 256
  single_device: -1        # -1 = one-to-many over all render-ok devices

  # --- Training (NAM's A2 numbers where the knob exists) -----------------------
  holdout_frac: 0.1
  clip_seconds: 2.0        # must match the corpus clip grid
  batch_size: 32
  pairs_per_epoch: 50000
  epochs: 100
  lr: 4.0e-3                # keep the decimal point -- PyYAML reads bare 4e-3 as a string
  weight_decay: 3.17e-7
  plateau_patience: 3
  plateau_factor: 0.5
  early_stop_patience: 8
  stft_weight: 0.05         # held at the EGDB-derived value deliberately, to keep the corpus
                            # as the only variable vs nam_a2_256 (this corpus's own NAM-scaled
                            # weight would be ~0.104; the STFT term misbehaves on this signal)
  preemph: 0.85
  num_workers: 6
  amp: true
  amp_dtype: bf16
  val_pairs: 2000
  log_every: 50
