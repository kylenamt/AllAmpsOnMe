# delta_a2_r32_512 with the per-layer nonlinearity switched to tanh -- one
# knob moved against delta_a2_r32_512, so the result is attributable. Run
# name = file stem.
#
#   openamp emulate --config configs/emulate/delta_a2_tanh_r32_512.yaml --overfit           # sanity #1
#   openamp emulate --config configs/emulate/delta_a2_tanh_r32_512.yaml --limit-devices 10  # mini-run
#   openamp emulate --config configs/emulate/delta_a2_tanh_r32_512.yaml                     # full run
#
# tanh is NAM's other A2-schema activation (parameter-free, still
# plugin-playable). wn_activation is resume-structural (train.py's
# _STRUCTURAL_KEYS), which is why this is its own run dir rather than a flag
# on delta_a2_r32_512.
#
# Full copy of delta_a2_r32_512.yaml's numbers -- see delta_a2_256.yaml.

emulate:
  # --- Model -------------------------------------------------------------------
  arch: delta_wavenet      # A2 topology; embedding -> low-rank residual on each conv
  wn_channels: 8           # A2 full-width submodel (the exports' other width is 3)
  wn_activation: tanh      # "leakyrelu" (the capture default) | "tanh"  <- the knob
  embedding_dim: 512       # widened with the rank so 23*32=736 DOF is not clipped to 256
  single_device: -1        # -1 = one-to-many over all render-ok devices
  delta_rank: 32           # generator is the limit only above rank 22 at this E

  # --- Training (NAM's A2 numbers where the knob exists) -----------------------
  holdout_frac: 0.1
  clip_seconds: 2.0        # must match the corpus clip grid
  batch_size: 32
  pairs_per_epoch: 50000
  epochs: 150              # this run's total budget (started at 100, extended +50)
  lr: 1.25e-4                # ReduceLROnPlateau's annealed value partway through this
                              # run's training, not the initial 4.0e-3 -- see train_log.csv
  weight_decay: 3.17e-7
  plateau_patience: 3
  plateau_factor: 0.5
  early_stop_patience: 15
  stft_weight: 0.05         # NAM's MRSTFT weight, rescaled from MSE to this trainer's ESR term
  preemph: 0.85            # 0.0 = NAM-faithful (plain ESR, no pre-emphasis)
  num_workers: 6
  amp: true
  amp_dtype: bf16
  val_pairs: 2000
  log_every: 50
