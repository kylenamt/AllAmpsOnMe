# delta_wavenet at rank 32 with embedding widened to 512 -- the top of the
# capacity ladder, where the embedding (not the rank) stops being the limit
# (min(23*32, 512) = 512, double every other run in the family). Run name =
# file stem.
#
#   openamp emulate --config configs/emulate/delta_a2_r32_512.yaml --overfit           # sanity #1
#   openamp emulate --config configs/emulate/delta_a2_r32_512.yaml --limit-devices 10  # mini-run
#   openamp emulate --config configs/emulate/delta_a2_r32_512.yaml                     # full run
#
# Moves two knobs at once (rank and embedding_dim), so a result here is about
# the pair, not either alone; delta_a2_r16_512 (E moved, rank held) is the
# control. See delta_a2_256.yaml for the rest of the ladder.
#
# Full copy of nam_a2.yaml's numbers -- see delta_a2_256.yaml.

emulate:
  # --- Model -------------------------------------------------------------------
  arch: delta_wavenet      # A2 topology; embedding -> low-rank residual on each conv
  wn_channels: 8           # A2 full-width submodel (the exports' other width is 3)
  embedding_dim: 512       # widened with the rank so 23*32=736 DOF is not clipped to 256
  single_device: -1        # -1 = one-to-many over all render-ok devices
  delta_rank: 32           # generator is the limit only above rank 22 at this E

  # --- Training (NAM's A2 numbers where the knob exists) -----------------------
  holdout_frac: 0.1
  clip_seconds: 2.0        # must match the corpus clip grid
  batch_size: 32
  pairs_per_epoch: 50000
  epochs: 100              # NAM trainer.max_epochs; early-stop still ends it sooner
  lr: 4.0e-3                # keep the decimal point -- PyYAML reads bare 4e-3 as a string
  weight_decay: 3.17e-7
  plateau_patience: 3
  plateau_factor: 0.5
  early_stop_patience: 15
  stft_weight: 0.05         # NAM's MRSTFT weight, rescaled from MSE to this trainer's ESR term
  preemph: 0.85            # 0.0 = NAM-faithful (plain ESR, no pre-emphasis)
  num_workers: 6
  amp: true
  amp_dtype: bf16
  val_pairs: 2000
  log_every: 50
