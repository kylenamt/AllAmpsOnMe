# delta_wavenet: conditioning moved from FiLM into the conv weights -- the
# embedding writes a low-rank residual onto each layer's kernel/bias/mixin
# instead of a per-channel affine on the output. Run name = file stem.
#
#   openamp emulate --config configs/emulate/delta_a2_256.yaml --overfit           # sanity #1
#   openamp emulate --config configs/emulate/delta_a2_256.yaml --limit-devices 10  # mini-run
#   openamp emulate --config configs/emulate/delta_a2_256.yaml                     # full run
#
# Not parameter-matched to film_wavenet (rank 8 = 130,127 params vs 94,576);
# see delta_a2_r6_256 for the matched pair (97,601).
#
# Full copy of nam_a2.yaml's numbers -- a per-run file replaces
# configs/openamp.yaml entirely, so omitted keys fall back to EmulateConfig
# defaults, not NAM's.

emulate:
  # --- Model -------------------------------------------------------------------
  arch: delta_wavenet      # A2 topology; embedding -> low-rank residual on each conv
  wn_channels: 8           # A2 full-width submodel (the exports' other width is 3)
  embedding_dim: 256
  single_device: -1        # -1 = one-to-many over all render-ok devices
  delta_rank: 8            # rank of the per-layer residual; the arch's only capacity knob

  # --- Training (NAM's A2 numbers where the knob exists) -----------------------
  holdout_frac: 0.1
  clip_seconds: 2.0        # must match the corpus clip grid
  batch_size: 32
  pairs_per_epoch: 50000
  epochs: 100              # NAM trainer.max_epochs; early-stop still ends it sooner
  lr: 4.0e-3                # keep the decimal point -- PyYAML reads bare 4e-3 as a string
  weight_decay: 3.17e-7
  plateau_patience: 3
  plateau_factor: 0.5
  early_stop_patience: 15
  stft_weight: 0.05         # NAM's MRSTFT weight, rescaled from MSE to this trainer's ESR term
  preemph: 0.85             # 0.0 = NAM-faithful (plain ESR, no pre-emphasis)
  num_workers: 6
  amp: true
  amp_dtype: bf16
  val_pairs: 2000
  log_every: 50
