# fp_dac_attn512 with the generator swapped for NAM's plain FiLM layer at a
# 256-wide embedding, plus 0.1 embedding jitter. Run name is the file stem ->
# results/joint/fp_dac_attn_nam256_noise10/.
#
#   OPENAMP_DATA_DIR=data openamp joint --config configs/joint/fp_dac_attn_nam256_noise10.yaml
#   OPENAMP_DATA_DIR=data openamp joint-eval results/joint/fp_dac_attn_nam256_noise10
#
# What differs from fp_dac_attn512.yaml (this file is a copy of it):
#   - model.arch delta_wavenet -> film_wavenet, and model.delta_rank dropped
#     (not a FiLMWaveNet argument). One nn.Linear(E, 2C) per layer produces
#     per-channel gamma/beta -- NAM's own conditioning -- instead of a rank-32
#     residual on each conv's weights. The A2 topology, channels and tanh
#     activation are the same, so the generator differs in the conditioning
#     path only.
#   - model.embedding_dim 512 -> 256.
#   - training.embed_noise_frac 0.0 -> 0.1.
#   - the schedule block, copied from fp_dac_attn512_noise15_win20.yaml:
#     scheduler cosine over 300 epochs with early stopping off, and
#     joint.enc_weight_decay 1.0e-4 -> 0.01 (uniform under the AdamW the joint
#     trainer now uses). lr / enc_lr unchanged at 4.0e-3 / 5.0e-4.
#
# So this is not a single-knob arm: arch, width, jitter and schedule all move
# at once. Read it against fp_dac_attn512_noise15_win20 (same schedule, same
# encoder, delta generator + 512 + jitter 0.15 + a 20 s window) and against
# fp_dac_attn512 (same encoder, no jitter, old schedule) to see which direction
# it lands, not to attribute the difference to any one field.
#
# Why the FiLM generator is worth asking about here. fp_dac_delta512's failure
# was a generator depending enormously on e -- shuffled ratio x15.4 -- while
# holdout ESR rose above the zero-conditioning floor: 405 isolated wells with
# nothing decodable between them. A rank-32 delta on every conv weight is a far
# larger conditioning surface than a per-channel affine, so FiLM is the smaller
# hypothesis class, harder to carve wells with. 256 rather than 512 points the
# same way -- fewer coordinates to memorize into, and DAC's per-frame latents
# measure ~3 effective dimensions of amp identity anyway, so 512 was never
# width the encoder could fill.
#
# Why 0.1 jitter. With enc_normalize: true, e is a unit vector, so
# training.embed_noise_frac reads the fraction against 1/sqrt(256) and
# re-projects onto the sphere -- a plain additive perturbation would mostly
# move |e|, an axis the generator never sees vary, so it would change drive
# level instead of teaching anything. At 0.1 that is a mean ||de|| of ~0.1 on a
# unit vector (cos ~0.995 to the clean embedding), just under the 0.15 the
# fp_dac_attn512_noise05/15/30 sweep's middle arm uses. Train steps only: val,
# shuffled and holdout all score clean embeddings.
#
# No frame_window here -- fp_dac_attn512, not the win20 file, is the base, so
# the encoder still reads all 14,728 frames of a device's shard.

data_dir: data   # was an OPENAMP_DATA_DIR prefix in the commands above

model:
  arch: film_wavenet
  channels: 8
  activation: tanh
  embedding_dim: 256

data:
  dataset: joint

  holdout_frac: 0.1
  clip_seconds: 2.0
  pairs_per_epoch: 50000
  sources: []

loss:
  name: esr_mrstft
  stft_weight: 0.05
  preemph_coeff: 0.85
  # Same as fp_dac_attn512: equalizes each device's expected share of the
  # pooled ESR gradient instead of letting it track render power. Not
  # comparable against a strength-0 val_esr; the holdout probe stays unweighted
  # regardless.
  device_loss_weighting: 1.0

training:
  batch_size: 32
  # 300, not 150: cosine's shape is set by the epoch budget, so the budget is now
  # part of the schedule rather than a ceiling early stopping was expected to
  # reach first.
  epochs: 300
  lr: 4.0e-3
  weight_decay: 3.17e-7
  # Cosine on epoch count, replacing reduce-on-plateau. The plateau schedule tied
  # both groups to the generator's val-ESR plateau, which is how fp_dac_delta512's
  # encoder ended up effectively frozen from ~epoch 105 while it was still the
  # component under test. A fixed curve anneals the encoder on its own budget
  # regardless of what the generator's loss is doing.
  scheduler: cosine
  # Each group floors at 1/100 of its own lr -- generator 4.0e-5, encoder 5.0e-6 --
  # rather than at a shared absolute floor, which at an 8x lr split would be a
  # different fraction of each. About 6-7 plateau halvings' worth, spread smoothly.
  cosine_min_lr_frac: 0.01
  plateau_patience: 3     # unused under scheduler: cosine, kept for provenance
  plateau_factor: 0.5
  # Off: > epochs, so it can never fire. Cosine assumes the whole curve runs, and
  # stopping mid-anneal at a high lr would leave a run that is neither a finished
  # cosine schedule nor comparable to one. checkpoint.pt still tracks best val ESR
  # whenever it occurs.
  early_stop_patience: 301
  num_workers: 6
  amp: true
  amp_dtype: bf16
  val_pairs: 2000
  log_every: 50
  # See the header for why the scale is 1/sqrt(256) on the sphere, not the table
  # std training/emulate.py uses.
  embed_noise_frac: 0.1

joint:
  encoder:
    kind: dac_frames
    # openamp.probes.extract's output: per-device [~14700, 1024] fp16 frame
    # shards, memmapped and looked up by device id -- same lookup design as
    # enc_kind: fingerprint, for the same reason (a codec fingerprint needs long
    # audio to be reliable; a joint reference window is 2 s).
    frames_path: results/dac_frames/sweep_train

    # CrossAttentionPool(latent_dim=1024, n_queries, d_model) -> pooled
    # n_queries*d_model -> proj (one Linear) -> 256.
    # 8x64=512 is left exactly as fp_dac_attn512 sets it, so the encoder is one
    # unchanged component across the two runs; with embedding_dim now 256 the
    # pool no longer ceilings the projection, it feeds a 2:1 reduction into it.
    n_queries: 8
    d_model: 64
    # ON, for the same reason fp_dac_delta512 turns it on: nothing else bounds
    # |e| and the reconstruction gradient inflates it. It is also what puts the
    # jitter above on the sphere.
    normalize: true

  ref:
    # fp_path / fp_preprocess / fp_layernorm belong to enc_kind: fingerprint and
    # do nothing here -- dac_frames has no precomputed pooled vector to look up
    # and no dry row to subtract (extract.py keeps wet frames only). Left at
    # their JointConfig defaults rather than restated.
    seconds: 2.0
    different_file: true
    min_gap_seconds: 1.0

  enc_lr: 5.0e-4
  # 0.01, up from the 1.0e-4 every earlier dac_frames arm ran -- AdamW's own
  # PyTorch default, and only meaningful now that the joint trainer uses AdamW,
  # making it one uniform shrinkage rather than Adam's per-parameter,
  # gradient-scaled version. Only this group -- training.weight_decay stays at
  # NAM's 3.17e-7 so the generator is still a NAM-comparable network.
  enc_weight_decay: 0.01
  grad_checkpoint_encoder: false
